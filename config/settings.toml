[data]
lake_dir = "data/lake"
raw_dir = "data/raw"
quality_dir = "data/quality"
history_start = "2016-01-01"
# Locked holdout (decision D7). Loader refuses rows with known_ts >= this date.
holdout_start = "2025-11-01"
holdout_end = "2026-11-01"

[costs]
stock_bps_per_side = 15   # D37 (2026-11-20): was 5; paper stock fills averaged +14 bps vs the submit-minute price
etf_bps_per_side = 2      # D37: kept; paper SPY fills averaged -2 bps
stress_multiplier = 2

[llm]
# Chosen 2026-11-03: cheapest current model ($0.10/$0.50 per MTok, batch -50%).
# Training-data cutoff per platform.claude.com models overview (fetched 2026-11-03): Jun 2026.
# D5: only documents published on/after scoring_eval_start count as go/no-go evidence.
scoring_model = "claude-haiku-5-5"
scoring_model_cutoff = "2026-06"
scoring_eval_start = "2026-07-01"
prompt_version = "v1"
monthly_budget_usd = 7.0   # D11, raised by D29 (was 3.0); enforced in trader.llm.budget
daily_budget_usd = 0.35    # ~= 7.0 / 21 trading days (D29; was 0.14)

[live]
timezone = "America/New_York"
# Strategy defaults shared by every account; [accounts.<name>] may override strategy / strategy_tag / params.
# D19: FALLBACK = 100% SPY until a strategy passes the P3 gate. Otherwise a strategy ID from signals.library.
# D26: S03 promoted research -> paper 2026-11-04 (docs/reviews/2026-11-04-S03-paper.md). Runs only from the frozen tag.
# D33: S03 failed the P7 holdout 2026-11-13; paper reverts to FALLBACK (100% SPY) until a candidate passes P7.
strategy = "FALLBACK"
strategy_tag = "strategy/S03/v2"  # D28: v2 = v1 + one-time entry
params = { lookback = 126, skip = 21 }

# D36: one block per broker account, each with its own state in live/<account>/ (docs/LIVE_PAPER.md).
# The endpoint follows the account name; `[live] mode` is gone.
[accounts.paper]
enabled = true
key_prefix = "ALPACA_TRADE"        # ALPACA_TRADE_KEY / _SECRET (paper keys)

[accounts.live]
enabled = false                    # true only after the user approves going live (PLAN.md P9, D34)
key_prefix = "ALPACA_LIVE_TRADE"   # ALPACA_LIVE_TRADE_KEY / _SECRET (cash account, this host only)
strategy = "FALLBACK"              # stays SPY until a strategy passes a forward holdout + P8

# D38: shadow forward tests (docs/STRATEGIES.md). No orders. At most 3 candidates; each is read once at
# read_sessions forward sessions. Adding or changing a candidate is a declaration: STRATEGIES.md first.
[shadow]
read_sessions = 126

[[shadow.candidates]]
name = "S14-sma100-daily"
strategy = "S14"
params = { sma = 100, rebalance = "daily" }
start = "2026-11-20"
in_sample = { sharpe = 1.08, sharpe_2x = 1.06, max_dd = -0.165, cagr = 0.122 }   # 20261120-162758-d32b75

[[shadow.candidates]]
name = "S16-news-k20"
strategy = "S16"
params = { k = 20, min_docs = 2 }
start = "2026-11-20"
