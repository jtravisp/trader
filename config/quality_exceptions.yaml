# Explained data-quality failures. Every entry needs a reason with evidence.
# "Explained" means the cause is known, not that the data is fine: see `action`.
- check: adjustment_2nd_source
  key: "DOC:*"
  reason: >-
    CONFIRMED Alpaca defect. Healthpeak took the DOC ticker from Physicians Realty in 2024. Alpaca's
    adjustment=all applies both companies' dividends to the reused ticker (factor steps on HCP
    ex-dates Feb 4/May 5/Nov 8 2016 and on Physicians Realty ex-dates Jan 13/Mar 30/Jun 30 2016),
    inflating adjusted returns by about 5-7%/yr. Yahoo is correct.
  action: "P3: rebuild adjustment factors from raw bars + Massive corporate actions; exclude DOC until then."
- check: adjustment_2nd_source
  key: "BDX:2022"
  reason: >-
    Probable. Embecta (EMBC) spin-off on 2022-04-01. Alpaca's factor doesn't credit the spin-off
    value (+2.5% vs Yahoo +5.1%, gap is about the EMBC distribution value).
  action: "P3 rebuild; spin-off handling must be verified on other spin-offs."
- check: adjustment_2nd_source
  key: "AVGO:2018"
  reason: Probable. Broadcom redomiciled Singapore -> US (new issuer) in April 2018; the vendors differ by 1.4%.
  action: "P3 rebuild."
- check: adjustment_2nd_source
  key: "BG:2023"
  reason: >-
    Probable. Bunge redomiciled to Switzerland (new issuer) in Nov 2023. Alpaca +5.1% vs Yahoo +3.8%;
    price change plus about a 2.7% dividend gives about 3.9%, so Yahoo looks right.
  action: "P3 rebuild."
- check: daily_gaps
  key: "*"
  reason: >-
    Two known patterns, reviewed 2026-11-04. (1) A ticker's history ends, then the ticker is reused by a
    different security that Alpaca files under the same symbol, giving one long gap that usually ends
    in 2025 (FB, PCLN, ULTI, LMNX, ...). (2) Trading halts and suspensions of days to weeks (GDC, ENSC,
    ORGO, PHUN, QVCGB, UNAM, AENT, NBIS).
  action: >-
    (1) Bars are clipped to each ticker's Massive listing window (D25), so another security's bars never
    reach the panel. (2) The engine keeps halted positions and can't trade them until prints resume.
    Re-review if a gap shows up in a seed name or an ETF.
- check: adjustment_2nd_source
  key: "SOR:2019"
  reason: Source Capital, a closed-end fund paying distributions. Alpaca +21.33% vs Yahoo +22.20% (0.9 pt), typical vendor disagreement on distribution treatment.
  action: "None (CEFs rarely make the top 1000)."
- check: fred
  key: "*"
  reason: >-
    ICSA, UNRATE and INDPRO end 42-92 days before the holdout start. That matches releases delayed by
    the October 2025 US federal government shutdown (BLS/DOL), with INDPRO waiting on BLS inputs.
  action: "None. Features carry the last published value, which is the point-in-time truth."
