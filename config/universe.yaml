stocks:
  # Research universe seed: top N US common stocks by median daily dollar volume
  # over the `rank_window_days` trading days ending just before the holdout.
  # The point-in-time monthly top-500 is built later (P3) from bars, inside this seed.
  target_count: 1000
  candidate_count: 1600
  rank_window_days: 60
  min_price: 5.0
  exchanges: [NYSE, NASDAQ, AMEX, ARCA, BATS]
minute_bars:
  # ETFs only, for slippage modelling
  start: "2021-01-01"
