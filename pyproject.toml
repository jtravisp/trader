[project]
name = "trader"
version = "0.1.0"
description = "Systematic US stock/ETF trading system (multi-day holds)"
authors = [
    { name = "jtravisp", email = "travis@travispollard.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "anthropic>=2.4.0",
    "duckdb>=2.0.0",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
    "yfinance>=1.8.0",
]

[project.scripts]
trader = "trader.cli:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]
ignore = ["E731", "B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
