name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: libomp (LightGBM needs it on macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: launchd installer syntax
        if: runner.os == 'macOS'
        run: bash -n scripts/macos/install-launchd.sh
